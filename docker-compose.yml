services:

  php:
    build: ./docker/php
    container_name: php_mvc_app
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: nginx_mvc
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: php_mvc_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvc_test
    ports:
      - "3306:3306"
    volumes:
      - db_data_new:/var/lib/mysql
      - ./mvc_test.sql:/docker-entrypoint-initdb.d/mvc_test.sql

volumes:
  db_data_new:
